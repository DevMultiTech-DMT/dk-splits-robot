name: DK splits robot

# ON/OFF SWITCH = this workflow's enabled state (Actions tab -> "DK splits robot"
# -> "..." -> Disable / Enable workflow). It ships DISABLED: nothing runs.
#
# When enabled it runs every 30 minutes around the clock. The first run after
# midnight Eastern takes the day's MORNING numbers; every run updates them; it
# also waits for the 15- and 10-minute marks before each game. Current day only:
# earlier days are deleted from Firebase. Saves ONLY to the Firebase `splits`
# collection (needs the FIREBASE_SERVICE_ACCOUNT secret). FanDuel moneylines are
# added only once the ODDS_API_KEY secret exists, and they're credit-budgeted.
#
# "Run workflow" by hand: look-only (default, saves nothing), check-firebase
# (proves the key works, touches no game data), or live (a real run).
on:
  schedule:
    - cron: "7,37 * * * *" # UTC; :07 and :37 dodge GitHub's busy top of the hour
  workflow_dispatch:
    inputs:
      mode:
        description: "look-only = print, save nothing | check-firebase / check-odds = test a key (free) | live = real run"
        type: choice
        options: [look-only, check-firebase, check-odds, live]
        default: look-only

concurrency:
  group: dk-splits-robot
  cancel-in-progress: false

permissions:
  contents: write # only for the keep-alive below; the robot saves nothing in this repo
  actions: write # the self-chain below starts the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # the robot (<= ~45 min with pre-game waits) + the wait for the next slot
    steps:
      - name: Note when this run started (the self-chain aims at the next slot after it)
        run: echo "RUN_START=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Look only (saves nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'look-only'
        run: python -m robot.main --dry-run --no-wait
      - name: Check the Firebase key
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-firebase'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m robot.main --check-firebase
      - name: Check the Odds API key (free, spends no credits)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-odds'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m robot.main --check-odds
      - name: Grab and save
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # FanDuel moneylines run ONLY when this secret exists (its own on/off switch)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # optional last day (YYYY-MM-DD, Eastern); after it the robot pulls nothing
          ROBOT_UNTIL: ${{ vars.ROBOT_UNTIL }}
          # optional one-day FanDuel budget raise, "YYYY-MM-DD=N"
          ODDS_CAP_TODAY: ${{ vars.ODDS_CAP_TODAY }}
        run: python -m robot.main
      # GitHub pauses timers in public repos after 60 days without a commit. Once
      # every ~25 days this rewrites one date in .keepalive -- no numbers, no history.
      - name: Keep the timer alive
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'live')
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25 * 86400 )) ]; then
            date -u +%F > .keepalive
            git config user.name "dk-splits-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -q -m "keepalive" && git push -q
          fi
      # SELF-CHAIN (10/3): GitHub's timer is best-effort -- on 10/3 it skipped every :07/:37
      # slot for the first hour after the robot was switched on. So every real run waits for
      # the next :07 or :37 and starts the next run itself. Only one run can wait in line
      # (concurrency group), so a working timer + this chain never pile up; disabling the
      # workflow stops the chain (the next start is refused).
      - name: Start the next run at the next :07 or :37
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'live')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the first :07 or :37 at least a minute after THIS run started; if the run's
          # pre-game waits already carried it past that slot, start the next run right away
          start=${RUN_START:-$(date -u +%s)}
          hour=$(( start - start % 3600 ))
          for t in 7 37 67; do
            slot=$(( hour + t * 60 ))
            if [ "$slot" -gt $(( start + 60 )) ]; then break; fi
          done
          wait=$(( slot - $(date -u +%s) ))
          [ "$wait" -lt 0 ] && wait=0
          echo "next run in ${wait}s (slot $(date -u -d @$slot +%H:%M) UTC)"
          sleep "$wait"
          gh workflow run robot.yml --repo "${{ github.repository }}" --ref main -f mode=live
