name: DK splits robot

# ON/OFF SWITCH = this workflow's enabled state (Actions tab -> "DK splits robot"
# -> "..." -> Disable / Enable workflow). Disabled = nothing runs.
#
# What it does (user 10/3): TWO kinds of grabs, nothing else --
#   1. the MORNING grab just after midnight Eastern (every game of the new day), and
#   2. ten minutes before each game (that game's numbers again).
# Between grabs one run sleeps and wakes itself on time (GitHub's own timer is
# best-effort: on 10/3 it skipped every slot for an hour). GitHub ends a job at 6
# hours, so the robot starts a fresh run before that and the fresh run carries on
# with the same plan (Firestore splits/_robot_plan). The hourly timer below is ONLY a
# backup that restarts the robot if it ever stops; a restart never repeats a grab.
# Saves ONLY to the Firebase `splits` collection. FanDuel lines need ODDS_API_KEY and
# follow the app's Auto-fill switch.
#
# "Run workflow" by hand: look-only (default, saves nothing), check-firebase /
# check-odds (prove a key works, free), or live (starts the robot).
on:
  schedule:
    - cron: "7 * * * *" # UTC; backup restart only -- an extra start waits in line or is replaced
  workflow_dispatch:
    inputs:
      mode:
        description: "look-only = print, save nothing | check-firebase / check-odds = test a key (free) | live = start the robot"
        type: choice
        options: [look-only, check-firebase, check-odds, live]
        default: look-only

concurrency:
  group: dk-splits-robot
  cancel-in-progress: false # one robot at a time; at most one start waits in line

permissions:
  contents: write # only for the keep-alive below; the robot saves nothing in this repo
  actions: write # the robot starts its own next run before GitHub's 6-hour limit

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # the robot hands off at ~325 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Look only (saves nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'look-only'
        run: python -m robot.main --dry-run --no-wait
      - name: Check the Firebase key
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-firebase'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m robot.main --check-firebase
      - name: Check the Odds API key (free, spends no credits)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-odds'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
        run: python -m robot.main --check-odds
      - name: Run the robot (morning grab + 10 minutes before each game)
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # FanDuel lines run ONLY when this secret exists (its own on/off switch)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # extra accounts (user 10/8), used in order once the one before runs down
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          # optional last day (YYYY-MM-DD, Eastern); after it the robot pulls nothing
          ROBOT_UNTIL: ${{ vars.ROBOT_UNTIL }}
          # optional one-day FanDuel budget raise, "YYYY-MM-DD=N"
          ODDS_CAP_TODAY: ${{ vars.ODDS_CAP_TODAY }}
          # lets the robot start its own next run (hand-off before the 6-hour limit)
          GH_TOKEN: ${{ github.token }}
        run: python -m robot.main
      # GitHub pauses timers in public repos after 60 days without a commit. Once
      # every ~25 days this rewrites one date in .keepalive -- no numbers, no history.
      - name: Keep the timer alive
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'live')
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25 * 86400 )) ]; then
            date -u +%F > .keepalive
            git config user.name "dk-splits-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -q -m "keepalive" && git push -q
          fi
