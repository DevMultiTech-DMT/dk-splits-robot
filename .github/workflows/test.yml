name: DK reachability test

# Read-only test: can GitHub's computers open the DraftKings splits page?
# Runs when you press "Run workflow", plus three times a day around busy
# betting hours (times are UTC; ET = UTC-4 in season).
on:
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"   # ~1:05 PM ET
    - cron: "35 22 * * *"  # ~6:35 PM ET
    - cron: "50 23 * * *"  # ~7:50 PM ET

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Try to open the DraftKings splits page
        run: python3 check_dk.py
